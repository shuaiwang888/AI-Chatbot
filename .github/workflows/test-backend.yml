name: Test Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/test-backend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install test runtime
        run: |
          pip install -q \
            fastapi 'pydantic>=2.9' pydantic-settings 'uvicorn[standard]' \
            python-multipart httpx sse-starlette python-dotenv \
            'openai>=1.60' tenacity cachetools 'langgraph>=0.3' 'langchain-core>=0.3' \
            'langgraph-checkpoint-sqlite>=2.0' numpy tiktoken pypdf \
            huggingface_hub pytest pytest-asyncio

      - name: AST sanity
        run: |
          python3 -c "
          import ast
          from pathlib import Path
          errors = []
          for py in Path('app').rglob('*.py'):
              tree = ast.parse(py.read_text())
              for node in ast.walk(tree):
                  if isinstance(node, ast.ImportFrom) and node.module and node.module.startswith('app.'):
                      rel = node.module.replace('.', '/')
                      if not Path(f'{rel}.py').exists() and not Path(rel).is_dir():
                          errors.append(f'{py}:{node.lineno} -> {node.module}')
          if errors:
              for e in errors: print('❌', e)
              raise SystemExit(1)
          print('✅ All imports resolve')
          "

      - name: Compile
        run: |
          python3 -m py_compile $(find app -name "*.py")
          echo "✅ All Python files compile"

      - name: Regression tests
        env:
          TESTING: "true"
          AUTH_REQUIRED: "false"
        run: |
          # Use the interpreter module entrypoint so the backend working directory
          # stays on sys.path. The pytest console script can otherwise resolve from
          # its bin directory and fail every import with "No module named app".
          python3 -m pytest -q tests/eval/test_quality_gate.py -k 'not deepeval_e2e'

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-smoke-output
          path: backend/.smoke-logs/
          if-no-files-found: ignore
