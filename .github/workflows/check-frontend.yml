name: Check Frontend

on:
  pull_request:
    branches: [main]
    paths: ['frontend/**', '.github/workflows/check-frontend.yml']
  push:
    branches: [main]
    paths: ['frontend/**', '.github/workflows/check-frontend.yml']

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          # This workflow validates the build only; the deploy workflow injects
          # the real endpoint from its protected GitHub secret.
          VITE_API_BASE: https://example.invalid
